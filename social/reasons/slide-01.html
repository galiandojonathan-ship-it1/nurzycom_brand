<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Reasons · slide 01</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+Display:ital,wght@1,300&display=swap">
<style>
  /* Instagram portrait post 1080 × 1350, informal style (see slide-01). */
  :root {
    --ink: #0A0A0A; --paper: #FAF8F3; --studio: #D5D5D4;
    --serif: 'Noto Serif Display', serif;
    --sans: 'Geist', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 64px 72px; }
  .slide::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(10,10,10,.12) 1.6px, transparent 1.6px); background-size: 36px 36px; }
  .slide > * { position: relative; }

  .top { display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
  .chip svg { width: 22px; height: 22px; }

  .text { position: absolute; left: 72px; right: 72px; bottom: 150px; }
  h1 { font: 700 92px/1 var(--sans); letter-spacing: -.035em; }
  h1 em { font: 300 italic 104px/1 var(--serif); letter-spacing: -.02em; }
  .sub { margin-top: 18px; font-size: 30px; line-height: 1.35; max-width: 40ch; color: #2b2a27; }
  .sub b { font-weight: 700; color: var(--ink); }

  .card { position: absolute; background: #fff; box-shadow: 0 24px 50px -18px rgba(10,10,10,.35); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .photo { left: 70px; top: 150px; width: 420px; padding: 18px 18px 64px; transform: rotate(-4deg); }
  .photo .ph { width: 384px; height: 520px; }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 300 italic 32px var(--serif); }
  .diploma { right: 64px; top: 230px; width: 500px; padding: 14px; transform: rotate(5deg); }
  .diploma .ph { width: 472px; height: 333px; }
  .tape { position: absolute; width: 130px; height: 40px; background: rgba(213,213,212,.9); }
  .photo .tape { top: -16px; left: 50%; transform: translateX(-50%) rotate(-4deg); }
  .diploma .tape.a { top: -18px; left: -36px; transform: rotate(-30deg); }
  .diploma .tape.b { bottom: -16px; right: -36px; transform: rotate(-30deg); }

  .sticker { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; font: 700 30px var(--sans); letter-spacing: -.01em; white-space: nowrap; box-shadow: 0 10px 24px -12px rgba(10,10,10,.4); }
  .sticker svg { width: 32px; height: 32px; flex: none; }
  .s-dark { background: var(--ink); color: var(--paper); }
  .s-light { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); }
  .s1 { top: 150px; right: 80px; transform: rotate(-4deg); }
  .s2 { top: 610px; right: 110px; transform: rotate(4deg); }
  .s3 { top: 730px; right: 70px; transform: rotate(-3deg); }

  .note { position: absolute; top: 845px; left: 540px; font: 300 italic 38px/1.1 var(--serif); transform: rotate(-4deg); }
  .arrow { position: absolute; top: 770px; left: 425px; width: 120px; height: 100px; }
  .arrow path { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .sparkle { position: absolute; width: 40px; height: 40px; }
  .sparkle path { fill: var(--ink); }
  .sp1 { top: 190px; left: 520px; }
  .sp2 { top: 860px; right: 110px; width: 28px; height: 28px; }

  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .swipe { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--ink); color: var(--paper); border-radius: 999px; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .s1, .s2, .s3 { top: auto; right: auto; bottom: auto; left: auto; }
  .sticker { z-index: 3; font-size: 27px; padding: 12px 20px; }
  .sticker svg { width: 28px; height: 28px; }
  .text .sub { max-width: 50ch; font-size: 28px; line-height: 1.4; margin-top: 14px; }
  .text h1 + .sub { margin-top: 18px; }
  .kick { font: 400 20px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: #5A5852; display: block; margin-bottom: 14px; }
  .num { position: absolute; z-index: 1; font: 300 italic 620px/.8 var(--serif); color: var(--ink); letter-spacing: -.04em; }
  .numcard { position: absolute; z-index: 1; width: 470px; height: 560px; background: #fff; box-shadow: 0 24px 50px -18px rgba(10,10,10,.35); display: grid; place-items: center; overflow: hidden; }
  .numcard b { font: 300 italic 560px/1 var(--serif); margin-top: -40px; }
  .numcard .tape { top: -16px; left: 50%; transform: translateX(-50%) rotate(-3deg); }
  .note { position: absolute; z-index: 3; font: 300 italic 36px/1.12 var(--serif); }
  .text { position: absolute; left: 72px; right: 72px; top: 150px; }
  .pre { font: 700 64px/1 var(--sans); letter-spacing: -.03em; }
  .big { margin-top: 8px; font: 300 italic 150px/1 var(--serif); letter-spacing: -.03em; white-space: nowrap; }
  .text .sub { margin-top: 18px; font-size: 30px; max-width: 40ch; }
  .pol { position: absolute; z-index: 1; background: #fff; padding: 16px 16px 60px; box-shadow: 0 24px 50px -18px rgba(10,10,10,.4); }
  .pol .ph { overflow: hidden; } .pol img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pol .cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 300 italic 30px var(--serif); }
  .pol .tape { top: -16px; left: 50%; transform: translateX(-50%) rotate(-3deg); }
  .p1 { right: 70px; top: 560px; width: 440px; transform: rotate(4deg); }
  .p1 .ph { height: 560px; }
  .s1 { top: 640px; left: 60px; transform: rotate(-5deg); }
  .s2 { top: 770px; left: 100px; transform: rotate(3deg); }
  .fine { position: absolute; left: 72px; top: 900px; max-width: 420px; font: 400 18px/1.5 var(--mono); letter-spacing: .06em; color: #5A5852; }
  .sp1 { top: 560px; left: 440px; } .sp2 { top: 1130px; left: 200px; width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <span class="chip"><svg class="i" viewBox="0 0 24 24"><path d="M2 16l20-6-9 10-2-5z"/><path d="M11 15l-9 1"/></svg>NYU Abu Dhabi</span>
    <span>01 / 08</span>
  </div>
  <div class="text">
    <div class="pre">Я отказался от</div>
    <div class="big">170 000 000 ₸</div>
    <p class="sub">4 причины, почему я сказал «нет» NYU&nbsp;Abu&nbsp;Dhabi</p>
  </div>
  <div class="pol p1"><span class="tape"></span><div class="ph"><img src="../assets/reasons-tower.jpg" alt=""></div><div class="cap">Абу-Даби, март 2026</div></div>
  <span class="sticker s-dark s1"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>полная стипендия</span>
  <span class="sticker s-light s2"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>≈ $355 000 · 4 года</span>
  <p class="fine">$88 862 в год × 4 года по пакету помощи NYUAD 2026–27, по курсу от 478 ₸ за $1</p>
  <svg class="sparkle sp1" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
  <svg class="sparkle sp2" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
  <div class="foot">
    <span>@nurzycom</span>
    <span class="swipe">Листай <svg class="i" viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
  </div>
</div>
</body>
</html>
