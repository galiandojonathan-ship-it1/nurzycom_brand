<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Story · slide 01</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+Display:ital,wght@1,300&display=swap">
<style>
  /* Instagram portrait post: 1080 × 1350. Keep text inside the 72px margin
     so the 3:4 profile-grid crop never cuts it. */
  :root {
    --ink: #0A0A0A; --paper: #FAF8F3; --studio: #D5D5D4; --stone: #5A5852;
    --serif: 'Noto Serif Display', serif;
    --sans: 'Geist', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  .slide { position: relative; width: 1080px; height: 1350px; padding: 72px; display: flex; flex-direction: column; }

  .meta { display: flex; justify-content: space-between; font: 400 20px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--stone); }

  h1 { margin-top: 40px; text-align: center; font: 300 italic 108px/.95 var(--serif); letter-spacing: -.025em; }
  .sub { margin: 24px auto 0; text-align: center; font-size: 28px; line-height: 1.4; max-width: 36ch; color: #2b2a27; }

  .photo {
    position: relative; flex: 1; margin: 40px auto 0; width: 600px;
    background: var(--studio); overflow: hidden;
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; filter: grayscale(1); display: none; }
  .photo.has img { display: block; }
  /* Photo tone: default is black and white; ?tone=warm or ?tone=color for comparison */
  .photo.warm img { filter: grayscale(1) sepia(.22) contrast(1.03); }
  .photo.color img { filter: none; }
  .slot { position: absolute; inset: 24px; border: 2px dashed rgba(10,10,10,.35); display: grid; place-items: center; text-align: center; font: 400 20px/1.8 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: rgba(10,10,10,.55); }
  .photo.has .slot { display: none; }

  .foot { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .2em; text-transform: uppercase; }
  .logo { width: 44px; height: 44px; }
  .logo path { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .logo text { font: 300 italic 21px var(--serif); fill: var(--ink); }
  .handle { display: flex; align-items: center; gap: 16px; }
</style>
</head>
<body>
<div class="slide">
  <div class="meta"><span>О себе</span><span>01 / 07</span></div>

  <h1>Меня зовут<br>Нурасыл.</h1>
  <p class="sub">4 олимпиадные медали, SAT 1560 и оффер от NYU&nbsp;Abu&nbsp;Dhabi. Рассказываю, как это было.</p>

  <!-- Photo slot: open this file with ?photo=path/to/photo.jpg, or put the path in src -->
  <div class="photo" id="photo">
    <img src="" alt="">
    <div class="slot">Ваше фото<br>вертикальное · ч/б<br>лицо в верхней трети</div>
  </div>

  <div class="foot">
    <span class="handle">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4l24.2 14v28L32 60 7.8 46V18z"/><text x="32" y="40.5" text-anchor="middle">NK</text></svg>
      @nurzycom
    </span>
    <span>Листайте →</span>
  </div>
</div>
<script>
  const src = new URLSearchParams(location.search).get('photo');
  if (src) {
    const box = document.getElementById('photo');
    box.querySelector('img').src = src;
    box.classList.add('has');
    const tone = new URLSearchParams(location.search).get('tone');
    if (tone) box.classList.add(tone);
  }
</script>
</body>
</html>
