<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Yussuf · slide 02</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+Display:ital,wght@1,300&display=swap">
<style>
  /* Instagram portrait post 1080 × 1350. Informal version: colour photo,
     stickers and doodles, same ink / paper / grey palette. */
  :root {
    --ink: #0A0A0A; --paper: #FAF8F3; --studio: #D5D5D4;
    --serif: 'Noto Serif Display', serif;
    --sans: 'Geist', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 64px 72px; }
  .slide::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(10,10,10,.12) 1.6px, transparent 1.6px); background-size: 36px 36px; }
  .slide > * { position: relative; }

  .top { display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
  .chip svg { width: 22px; height: 22px; }

  h1 { margin-top: 36px; font: 700 92px/1 var(--sans); letter-spacing: -.035em; }
  h1 em { font: 300 italic 104px/1 var(--serif); letter-spacing: -.02em; }
  .sub { margin-top: 18px; font-size: 30px; line-height: 1.35; max-width: 40ch; color: #2b2a27; }

  .ph.has img { display: block; }
  .slot { position: absolute; inset: 0; display: grid; place-items: center; font: 400 20px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(10,10,10,.5); }
  .ph.has .slot { display: none; }
  .tape { position: absolute; width: 150px; height: 44px; background: rgba(213,213,212,.9); }
  .tape.a { top: -18px; left: -44px; transform: rotate(-32deg); }
  .tape.b { top: -16px; right: -48px; transform: rotate(28deg); }

  .sticker { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; font: 700 30px var(--sans); letter-spacing: -.01em; white-space: nowrap; box-shadow: 0 10px 24px -12px rgba(10,10,10,.4); }
  .sticker svg { width: 32px; height: 32px; flex: none; }
  .s-dark { background: var(--ink); color: var(--paper); }
  .s-light { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); }

  .todo { outline: 2px dashed #c33; outline-offset: 3px; color: #c33; }
  .sparkle { position: absolute; width: 44px; height: 44px; }
  .sparkle path { fill: var(--ink); }

  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .swipe { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--ink); color: var(--paper); border-radius: 999px; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .polaroid, .doc { position: absolute; background: #fff; box-shadow: 0 24px 50px -18px rgba(10,10,10,.35); }
  .polaroid { padding: 18px 18px 64px; }
  .ph { position: relative; background: var(--studio); overflow: hidden; }
  .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cap { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 300 italic 34px var(--serif); }
  .doc { padding: 16px; }
  .doc img { display: block; width: 100%; }
  .doc .lab { margin-top: 12px; font: 400 17px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #5A5852; }
  .sticker { z-index: 3; }
  .note { position: absolute; z-index: 3; font: 300 italic 36px/1.12 var(--serif); }
  .text { position: absolute; left: 72px; right: 72px; }
  .text .sub { max-width: 46ch; font-size: 30px; line-height: 1.4; }
  .text .sub + .sub { margin-top: 18px; }
  .tape.a { top: -18px; left: -40px; transform: rotate(-30deg); }
  .tape.b { top: -16px; right: -44px; transform: rotate(26deg); }

  .t2 { top: 140px; }
  .t2 h1 { margin: 0; }
  .d1 { left: 56px; top: 290px; width: 620px; transform: rotate(-3deg); z-index: 1; }
  .d2 { right: 48px; top: 740px; width: 700px; transform: rotate(2deg); z-index: 2; }
  .doc .tape { top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg); }
  .k1 { top: 340px; right: 50px; transform: rotate(5deg); }
  .k3 { top: 500px; right: 70px; transform: rotate(-3deg); }
  .n2 { top: 880px; left: 60px; transform: rotate(-4deg); font-size: 32px; }
  .sp1 { top: 330px; right: 340px; } .sp2 { top: 1210px; left: 130px; width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <span class="chip"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>январь → июнь</span>
    <span>02 / 05</span>
  </div>

  <div class="text t2">
    <h1>Было и <em>стало</em></h1>
  </div>
  <div class="doc d1">
    <span class="tape"></span>
    <img src="../assets/yussuf-practice.jpg" alt="">
    <div class="lab">пробный тест Bluebook · 10.01.2026</div>
  </div>
  <div class="doc d2">
    <span class="tape"></span>
    <img src="../assets/yussuf-official.jpg" alt="">
    <div class="lab">официальный SAT · 06.06.2026</div>
  </div>
  <span class="sticker s-dark k1"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg>Verbal 620 → 780</span>
  <span class="sticker s-light k3"><svg class="i" viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-5 3 3 5-6"/></svg>Math 680 → 800</span>
  <span class="note n2">1300 был<br>пробником.<br>1580 уже<br>официальный.</span>
  <svg class="sparkle sp1" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg><svg class="sparkle sp2" viewBox="0 0 24 24"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>

  <div class="foot">
    <span>@nurzycom</span>
    <span class="swipe">Листай <svg class="i" viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
  </div>
</div>
</body>
</html>
