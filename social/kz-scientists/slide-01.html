<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KZ scientists · slide 01</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+Display:ital,wght@1,300&display=swap">
<style>
  /* Instagram portrait post 1080 × 1350. Informal version: colour photo,
     stickers and doodles, same ink / paper / grey palette. */
  :root {
    --ink: #0A0A0A; --paper: #FAF8F3; --studio: #D5D5D4;
    --serif: 'Noto Serif Display', serif;
    --sans: 'Geist', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 64px 72px; }
  .slide::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(10,10,10,.12) 1.6px, transparent 1.6px); background-size: 36px 36px; }
  .slide > * { position: relative; }

  .top { display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
  .chip svg { width: 22px; height: 22px; }

  .sub { margin-top: 18px; font-size: 30px; line-height: 1.35; max-width: 40ch; color: #2b2a27; }

  .tape { position: absolute; width: 150px; height: 44px; background: rgba(213,213,212,.9); }

  .sticker { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; font: 700 30px var(--sans); letter-spacing: -.01em; white-space: nowrap; box-shadow: 0 10px 24px -12px rgba(10,10,10,.4); }
  .sticker svg { width: 32px; height: 32px; flex: none; }
  .s-dark { background: var(--ink); color: var(--paper); }
  .s-light { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); }

  .todo { outline: 2px dashed #c33; outline-offset: 3px; color: #c33; }
  .sparkle { position: absolute; width: 44px; height: 44px; }
  .sparkle path { fill: var(--ink); }

  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font: 400 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .swipe { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--ink); color: var(--paper); border-radius: 999px; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  h1 { font: 700 84px/1.02 var(--sans); letter-spacing: -.035em; }
  h1 em { font: 300 italic 96px/1 var(--serif); letter-spacing: -.02em; }
  .tt { position: absolute; left: 72px; right: 72px; top: 150px; }
  .tt .sub { margin-top: 20px; font-size: 30px; line-height: 1.4; max-width: 44ch; color: #2b2a27; }
  .body { position: absolute; left: 72px; right: 72px; }
  .lab { display: block; font: 400 18px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: #5A5852; }
  .paper { position: relative; padding: 38px 42px 32px; background: #fff; box-shadow: 0 24px 50px -18px rgba(10,10,10,.3); }
  .tape { position: absolute; top: -18px; left: 50%; width: 150px; height: 44px; background: rgba(213,213,212,.9); transform: translateX(-50%) rotate(-3deg); z-index: 2; }
  .q { font: 300 italic 40px/1.22 var(--serif); }
  .src { margin-top: 12px; font: 400 17px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #5A5852; }
  .ru { margin-top: 12px; font: 400 26px/1.4 var(--sans); color: #2b2a27; }
  .dark { padding: 32px 38px; background: var(--ink); color: var(--paper); border-radius: 28px; }
  .dark .lab { color: rgba(250,248,243,.7); }
  .dark p { margin-top: 10px; font: 400 29px/1.38 var(--sans); }
  .dark p b, .paper p b { font-weight: 700; }
  .pol { position: absolute; padding: 14px 14px 56px; background: #fff; box-shadow: 0 24px 50px -18px rgba(10,10,10,.35); }
  .pol img { display: block; width: 100%; }
  .pol .cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 300 italic 30px var(--serif); }
  .big { font: 300 italic 200px/.9 var(--serif); letter-spacing: -.04em; }
  .body.paper { position: absolute; }
  .next { position: absolute; z-index: 5; left: 72px; right: 72px; top: 1150px; font: 300 italic 36px/1.15 var(--serif); }
  .next::after { content: ' →'; font-family: var(--sans); font-style: normal; font-weight: 500; }
  .foot .swipe svg { width: 22px; height: 22px; }

  .tt h1 { font-size: 90px; } .tt h1 em { font-size: 104px; }
  .nm { top: 560px; display: grid; gap: 12px; }
  .nm span { display: flex; align-items: center; gap: 22px; font: 300 italic 70px/1.05 var(--serif); }
  .nm img { width: 82px; height: 82px; border-radius: 50%; object-fit: cover; object-position: center 25%; border: 3px solid var(--ink); }
  .nm span:nth-child(even) { padding-left: 120px; }
  .k1 { position: absolute; z-index: 3; top: 600px; right: 70px; transform: rotate(6deg); }
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <span class="chip"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>2026 · елестетіп көрейік</span>
    <span>01 / 8</span>
  </div>

  <div class="tt"><h1>Ұлы ғалымдарымыз 2026 жылы <em>17 жаста</em> болса</h1>
  <p class="sub">Олардың академиялық портфолиосы қандай болар еді және қай мамандыққа оқыр еді?</p></div>
  <div class="body nm"><span style="color:#9C4F22"><img style="border-color:#9C4F22" src="../assets/kz-satpayev.jpg" alt="">Сәтбаев</span><span style="color:#1B6676"><img style="border-color:#1B6676" src="../assets/kz-ualikhanov.jpg" alt="">Уәлиханов</span><span style="color:#5B2E91"><img style="border-color:#5B2E91" src="../assets/kz-buketov.jpg" alt="">Бөкетов</span><span style="color:#2338A0"><img style="border-color:#2338A0" src="../assets/kz-sultangazin.jpg" alt="">Сұлтанғазин</span><span style="color:#2F7A33"><img style="border-color:#2F7A33" src="../assets/kz-aitkhozhin.jpg" alt="">Айтхожин</span></div>
  <span class="sticker s-dark k1">5 ғалым · 5 сала</span>
  <p class="next">алдымен ойынның ережесі</p>

  <div class="foot">
    <span>@nurzycom</span>
    <span class="swipe">Әрі қарай <svg class="i" viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
  </div>
</div>
</body>
</html>
