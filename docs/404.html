<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Страница не найдена · nurzycom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono&family=Noto+Serif+Display:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0A;--paper:#FAF8F3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:400 17px/1.6 Geist,system-ui,sans-serif;padding:24px 16px}
main{max-width:620px}
.label{font:12px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,248,243,.62)}
h1{font:italic 300 clamp(52px,11vw,96px)/1 "Noto Serif Display",Georgia,serif;margin:14px 0 18px}
p{margin:0 0 10px;color:rgba(250,248,243,.8)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
a.btn{display:inline-block;padding:13px 20px;border:1px solid var(--paper);color:var(--paper);text-decoration:none;font-weight:500}
a.btn.solid{background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<main>
  <p class="label">404 · nurzycom · курс SAT</p>
  <h1>Страница не найдена</h1>
  <p>Такой страницы на сайте курса нет. Возможно, ссылка старая: откройте план курса или домашние задания.</p>
  <div class="row"><a class="btn solid" href="/plan.html">План курса</a><a class="btn" href="/index.html">Домашние задания</a><a class="btn" href="https://t.me/nurzycom">Написать в Telegram</a></div>
</main>
<script>
// on a github.io project address the site lives under /<repo>/, on its own domain at the root
(function () { var seg = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] : "";
  document.querySelectorAll('a[href^="/"]').forEach(function (a) { a.setAttribute("href", seg + a.getAttribute("href")); }); })();
</script>
</body>
</html>
